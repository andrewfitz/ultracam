[package]
name = "ultracam-auto-switcher"
version = "0.1.0"
edition = "2021"
description = "Realtime and offline talking-head camera direction engine"
license = "Apache-2.0"

[lib]
name = "auto_switcher"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "auto-switcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"

# The toolchain's bundled rust-objcopy is not usable on this host because its
# libLLVM.dylib is absent. Keep symbols intact here; Xcode strips the final app
# product during its normal release packaging step.
[profile.release]
strip = false
